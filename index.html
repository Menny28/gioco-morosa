<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tamagotchi Gestionale GBA ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1528;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .game-wrapper {
            background: #2b233c;
            border: 4px solid #ff79c6;
            border-radius: 12px;
            padding: 12px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 8px 25px rgba(255, 121, 198, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        h1 { font-size: 1rem; color: #ff79c6; margin: 0 0 2px 0; }
        .top-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #bd93f9; margin-bottom: 8px; }

        .room-scene {
            position: relative;
            width: 100%;
            height: 190px;
            background-color: #383a59;
            border: 3px solid #44475a;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-unico {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .speech {
            position: absolute; bottom: 5px; left: 8px; right: 8px;
            background: rgba(40, 42, 54, 0.95); border: 1px solid #6272a4; border-radius: 4px;
            padding: 4px; font-size: 0.75rem; color: #50fa7b; z-index: 3;
        }

        /* Statistiche */
        .stats {
            background: #1e1e2f; border: 2px solid #44475a; border-radius: 6px;
            padding: 6px; margin-bottom: 8px; font-size: 0.75rem; text-align: left;
        }
        .stat-row { margin-bottom: 5px; }
        .stat-row:last-child { margin-bottom: 0; }
        .bar-bg { background: #282a36; border: 1px solid #44475a; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        .bar-fill { height: 100%; background: #50fa7b; width: 100%; transition: width 0.4s ease-in-out; }

        /* Pulsanti di azione */
        .buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
        button {
            background: #44475a; color: white; border: 2px solid #6272a4; border-radius: 5px;
            padding: 8px; font-family: 'Courier New', Courier, monospace; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s;
        }
        button:active { background: #ff79c6; color: #1a1528; transform: scale(0.97); }
        button.special { grid-column: span 2; background: #6272a4; border-color: #ff79c6; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>TAMAGOTCHI GBA</h1>
        <div class="top-info">
            <span id="ore-text">Ore: 12:00</span>
            <span>🪙 Monete: <span id="monete-val">50</span></span>
        </div>

        <div class="room-scene" id="scivola-scena">
            <!-- Immagine dinamica che sfrutta le tre immagini -->
            <img id="img-personaggio" src="assets/sfondo.png" class="bg-unico" alt="Stanza Gestionale">
            <div class="speech" id="status-text">Pronto a giocare con te!</div>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span>🍕 Fame: <span id="fame-text">100</span>%</span>
                <div class="bar-bg"><div class="bar-fill" id="fame-bar"></div></div>
            </div>
            <div class="stat-row">
                <span>🚿 Igiene: <span id="igiene-text">100</span>%</span>
                <div class="bar-bg"><div class="bar-fill" id="igiene-bar" style="background:#8be9fd;"></div></div>
            </div>
            <div class="stat-row">
                <span>⚡ Energia: <span id="energia-text">100</span>%</span>
                <div class="bar-bg"><div class="bar-fill" id="energia-bar" style="background:#ffb86c;"></div></div>
            </div>
        </div>

        <div class="buttons-grid">
            <button onclick="nutri()">🍕 Cibo (15🪙)</button>
            <button onclick="lava()">🚿 Doccia</button>
            <button onclick="dormi()">💤 Dormi</button>
            <button onclick="gioca()">🎮 Gioca (+20🪙)</button>
            <button class="special" onclick="coccola()">❤️ Coccola speciale</button>
        </div>
    </div>

    <script>
        let fame = 100, igiene = 100, energia = 100, monete = 50;
        let isDormendo = false;
        let umoreTemporaneo = "normale"; // Tiene traccia se deve mostrare l'immagine felice

        function aggiorna() {
            document.getElementById("fame-text").innerText = fame;
            document.getElementById("fame-bar").style.width = fame + "%";
            document.getElementById("igiene-text").innerText = igiene;
            document.getElementById("igiene-bar").style.width = igiene + "%";
            document.getElementById("energia-text").innerText = energia;
            document.getElementById("energia-bar").style.width = energia + "%";
            document.getElementById("monete-val").innerText = monete;

            let status = document.getElementById("status-text");
            let img = document.getElementById("img-personaggio");

            if (isDormendo) {
                status.innerText = "Zzz... sta riposando 💤";
                img.src = "assets/affamato.png"; 
            } else if (umoreTemporaneo === "felice") {
                status.innerText = "Evviva! Che bello! 🥰";
                img.src = "assets/felice.png";
            } else if (fame < 35 || energia < 25) {
                status.innerText = "Uffa, ho fame o sono stanco! 😭";
                img.src = "assets/affamato.png"; 
            } else {
                status.innerText = "Sto comodamente sul divano 😎";
                img.src = "assets/sfondo.png"; 
            }
        }

        function attivaFeliceTemporaneo() {
            umoreTemporaneo = "felice";
            setTimeout(() => {
                umoreTemporaneo = "normale";
                aggiorna();
            }, 2500); // Torna normale dopo 2.5 secondi
        }

        function nutri() {
            if (isDormendo) return;
            if (monete >= 15) {
                monete -= 15;
                fame = Math.min(100, fame + 30);
                attivaFeliceTemporaneo();
                faiAnimazione();
                aggiorna();
            } else {
                alert("Non hai abbastanza monete! Gioca per guadagnarle.");
            }
        }

        function lava() {
            if (isDormendo) return;
            igiene = Math.min(100, igiene + 35);
            attivaFeliceTemporaneo();
            faiAnimazione();
            aggiorna();
        }

        function dormi() {
            isDormendo = !isDormendo;
            if (isDormendo) {
                document.getElementById("status-text").innerText = "A nanna... 🌙";
            } else {
                energia = 100;
                attivaFeliceTemporaneo();
                aggiorna();
            }
        }

        function gioca() {
            if (isDormendo) return;
            monete += 20; 
            energia = Math.max(0, energia - 15); 
            fame = Math.max(0, fame - 10);
            attivaFeliceTemporaneo();
            faiAnimazione();
            aggiorna();
        }

        function coccola() {
            if (isDormendo) return;
            fame = Math.min(100, fame + 10);
            igiene = Math.min(100, igiene + 10);
            energia = Math.min(100, energia + 10);
            attivaFeliceTemporaneo();
            faiAnimazione();
            aggiorna();
        }

        function faiAnimazione() {
            let scena = document.getElementById("scivola-scena");
            scena.style.transform = "translateY(-4px)";
            setTimeout(() => { scena.style.transform = "translateY(0)"; }, 150);
        }

        let oraCorrente = 12;
        setInterval(() => {
            if (!isDormendo) {
                if (fame > 0) fame -= 1;
                if (igiene > 0) igiene -= 1;
                if (energia > 0) energia -= 1;
            } else {
                if (energia < 100) energia += 3;
            }
            
            oraCorrente = (oraCorrente + 1) % 24;
            document.getElementById("ore-text").innerText = "Ore: " + (oraCorrente < 10 ? "0" : "") + oraCorrente + ":00";
            
            aggiorna();
        }, 5000);

        aggiorna();
    </script>
</body>
</html>
