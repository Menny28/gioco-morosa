<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tommy Tamagotchi ❤️</title>
    <style>
        body { margin: 0; background-color: #1a1528; color: #fff; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .game-wrapper { background: #2b233c; border: 4px solid #ff79c6; border-radius: 12px; padding: 10px; width: 95%; max-width: 450px; height: 95vh; display: flex; flex-direction: column; }
        
        .main-display { position: relative; width: 100%; height: 280px; border: 3px solid #44475a; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
        .bg-video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .status-img { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none; }

        .stat-box { background: #1e1e2f; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 0.8rem; }
        .bar-outer { background: #282a36; height: 10px; border-radius: 5px; overflow: hidden; margin: 4px 0; }
        .bar-inner { height: 100%; background: #50fa7b; width: 100%; transition: width 0.5s; }
        
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        button { background: #44475a; color: white; border: 1px solid #ff79c6; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        button:active { background: #ff79c6; color: #1a1528; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #2b233c; z-index: 10; display: none; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div style="text-align: center; margin-bottom: 10px; color: #ff79c6;">Insieme da: <span id="giorni-count"></span> giorni ❤️</div>

    <div class="main-display">
        <video autoplay muted loop playsinline class="bg-video" src="assets/sfondo.mp4"></video>
        <img id="status-img" class="status-img">
    </div>

    <div class="stat-box">
        <div>Fame: <span id="f-txt">100</span>%</div>
        <div class="bar-outer"><div id="f-bar" class="bar-inner"></div></div>
        <div>Igiene: <span id="i-txt">100</span>%</div>
        <div class="bar-outer"><div id="i-bar" class="bar-inner" style="background:#8be9fd;"></div></div>
        <div>Energia: <span id="e-txt">100</span>%</div>
        <div class="bar-outer"><div id="e-bar" class="bar-inner" style="background:#ffb86c;"></div></div>
    </div>

    <div class="buttons-grid">
        <button onclick="apriOverlay('frigo')">🧊 Frigo</button>
        <button onclick="apriOverlay('negozio')">🛒 Negozio</button>
        <button onclick="lava()">🚿 Doccia</button>
        <button onclick="dormi()">💤 Dormi</button>
        <button onclick="apriOverlay('gioco')">🎮 Gioco</button>
    </div>

    <!-- Area Overlay per i menu -->
    <div id="overlay" class="overlay">
        <button onclick="chiudiOverlay()" style="margin-bottom: 20px;">❌ Chiudi</button>
        <div id="overlay-content"></div>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('tommy_data')) || { fame: 100, igiene: 100, energia: 100, monete: 100 };
    let stato = "sfondo";

    function calcolaGiorni() {
        let diff = Math.floor((new Date() - new Date(2025, 5, 22)) / (1000 * 60 * 60 * 24));
        document.getElementById("giorni-count").innerText = diff;
    }

    function aggiorna() {
        // Grafica
        let img = document.getElementById("status-img");
        if (stato === "sfondo") img.style.display = "none";
        else { img.src = `assets/${stato}.png`; img.style.display = "block"; }

        // Testo barre
        document.getElementById("f-txt").innerText = Math.round(data.fame);
        document.getElementById("i-txt").innerText = Math.round(data.igiene);
        document.getElementById("e-txt").innerText = Math.round(data.energia);
        document.getElementById("f-bar").style.width = data.fame + "%";
        document.getElementById("i-bar").style.width = data.igiene + "%";
        document.getElementById("e-bar").style.width = data.energia + "%";
        
        localStorage.setItem('tommy_data', JSON.stringify(data));
    }

    function apriOverlay(tipo) {
        document.getElementById("overlay").style.display = "block";
        let cont = document.getElementById("overlay-content");
        cont.innerHTML = `<h3>${tipo.toUpperCase()}</h3>`;
        if(tipo === 'gioco') {
            stato = "gioco";
            aggiorna();
            cont.innerHTML += `<button onclick="gioca()">Gioca a Sasso Carta Forbice</button>`;
        }
        // Aggiungi qui logica negozio/frigo...
    }
    
    function chiudiOverlay() { 
        document.getElementById("overlay").style.display = "none"; 
        stato = "sfondo"; 
        aggiorna(); 
    }

    function lava() { 
        stato = "pulizia"; 
        data.igiene = 100; 
        aggiorna(); 
        setTimeout(() => { stato = "sfondo"; aggiorna(); }, 3000); 
    }

    function dormi() { stato = "sonno"; aggiorna(); }
    function gioca() { alert("Tommy ha vinto!"); }

    setInterval(() => {
        if (stato !== "sonno") {
            data.fame -= 0.1; 
            if (data.fame < 50) stato = "affamato";
            else if (data.igiene < 50) stato = "sporco";
            else if (stato !== "gioco" && stato !== "pulizia") stato = "sfondo";
        }
        aggiorna();
    }, 5000);

    calcolaGiorni();
    aggiorna();
</script>
</body>
</html>
