<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tommy Tamagotchi ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1528;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .game-wrapper {
            background: #2b233c;
            border: 4px solid #ff79c6;
            border-radius: 12px;
            padding: 12px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 8px 25px rgba(255, 121, 198, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        h1 { font-size: 1.1rem; color: #ff79c6; margin: 0 0 2px 0; }
        .top-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #bd93f9; margin-bottom: 8px; }

        .room-scene {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #383a59;
            border: 3px solid #44475a;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-unico {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay interattivo per il mini-gioco */
        .minigame-overlay {
            position: absolute; inset: 0; background: rgba(26, 21, 40, 0.9);
            z-index: 5; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 10px;
        }
        .minigame-overlay p { font-size: 0.8rem; color: #ff79c6; margin-bottom: 10px; }
        .mg-btns { display: flex; gap: 8px; }
        .mg-btn { background: #6272a4; border: 1px solid #ff79c6; color: white; padding: 5px 10px; border-radius: 4px; font-family: inherit; font-size: 0.75rem; cursor: pointer; }

        /* Statistiche */
        .stats {
            background: #1e1e2f; border: 2px solid #44475a; border-radius: 6px;
            padding: 6px; margin-bottom: 8px; font-size: 0.75rem; text-align: left;
        }
        .stat-row { margin-bottom: 5px; }
        .stat-row:last-child { margin-bottom: 0; }
        .bar-bg { background: #282a36; border: 1px solid #44475a; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        .bar-fill { height: 100%; background: #50fa7b; width: 100%; transition: width 0.4s ease-in-out; }

        /* Pulsanti di azione */
        .buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
        button {
            background: #44475a; color: white; border: 2px solid #6272a4; border-radius: 5px;
            padding: 8px; font-family: 'Courier New', Courier, monospace; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s;
        }
        button:active { background: #ff79c6; color: #1a1528; transform: scale(0.97); }
        button.special { grid-column: span 2; background: #6272a4; border-color: #ff79c6; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>TOMMY TAMAGOTCHI</h1>
        <div class="top-info">
            <span id="ore-text">Ore: --:--</span>
            <span>🪙 Monete: <span id="monete-val">50</span></span>
        </div>

        <div class="room-scene" id="scivola-scena">
            <!-- Immagine dinamica pulita senza scritte sopra -->
            <img id="img-personaggio" src="assets/sfondo.png" class="bg-unico" alt="Tommy Stanza">

            <!-- Schermata del Mini-gioco -->
            <div class="minigame-overlay" id="minigame-box">
                <p id="mg-domanda">Tommy vuole qualcosa... cosa sceglie?</p>
                <div class="mg-btns">
                    <button class="mg-btn" onclick="rispondiMiniGioco('pizza')">🍕 Pizza</button>
                    <button class="mg-btn" onclick="rispondiMiniGioco('doccia')">🚿 Doccia</button>
                    <button class="mg-btn" onclick="rispondiMiniGioco('nanna')">💤 Cuscino</button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span>🍕 Fame: <span id="fame-text">100</span>%</span>
                <div class="bar-bg"><div class="bar-fill" id="fame-bar"></div></div>
            </div>
            <div class="stat-row">
                <span>🚿 Igiene: <span id="igiene-text">100</span>%</span>
                <div class="bar-bg"><div class="bar-fill" id="igiene-bar" style="background:#8be9fd;"></div></div>
            </div>
            <div class="stat-row">
                <span>⚡ Energia: <span id="energia-text">100</span>%</span>
                <div class="bar-bg"><div class="bar-fill" id="energia-bar" style="background:#ffb86c;"></div></div>
            </div>
        </div>

        <div class="buttons-grid">
            <button onclick="nutri()">🍕 Cibo (15🪙)</button>
            <button onclick="lava()">🚿 Doccia</button>
            <button onclick="dormi()">💤 Dormi</button>
            <button onclick="avviaMiniGioco()">🎮 Minigioco</button>
            <button class="special" onclick="coccola()">❤️ Coccola speciale</button>
        </div>
    </div>

    <script>
        // Dati di gioco salvati in memoria locale per calcolare il tempo a sito chiuso
        let giocoData = JSON.parse(localStorage.getItem('tommy_data')) || {
            fame: 100,
            igiene: 100,
            energia: 100,
            monete: 50,
            isDormendo: false,
            timestamp: Date.now()
        };

        let umoreTemporaneo = "normale";
        let desiderioCorretto = "pizza";

        // Calcola il tempo trascorso quando riapri il sito
        function calcolaTempoAssenza() {
            let oraAttuale = Date.now();
            let secondiPassati = Math.floor((oraAttuale - giocoData.timestamp) / 1000);
            
            if (secondiPassati > 10) { // Se è passato più di qualche secondo
                let cicli = Math.floor(secondiPassati / 15); // Ogni 15 secondi offline consuma un blocco
                
                if (giocoData.isDormendo) {
                    giocoData.energia = Math.min(100, giocoData.energia + (cicli * 2));
                } else {
                    giocoData.fame = Math.max(0, giocoData.fame - (cicli * 1));       // Fame scende normale
                    giocoData.igiene = Math.max(0, giocoData.igiene - (Math.floor(cicli * 0.3))); // Igiene scende molto lentamente
                    giocoData.energia = Math.max(0, giocoData.energia - (Math.floor(cicli * 0.5))); // Energia scende lentamente
                    giocoData.monete += Math.floor(cicli * 0.2); // Guadagna qualcosina col tempo
                }
            }
            salvaStato();
        }

        function salvaStato() {
            giocoData.timestamp = Date.now();
            localStorage.setItem('tommy_data', JSON.stringify(giocoData));
        }

        function aggiornaInterfaccia() {
            // Orario in tempo reale del telefono
            let dataOggi = new Date();
            let ore = String(dataOggi.getHours()).padStart(2, '0');
            let minuti = String(dataOggi.getMinutes()).padStart(2, '0');
            document.getElementById("ore-text").innerText = "Ore: " + ore + ":" + minuti;

            document.getElementById("fame-text").innerText = Math.round(giocoData.fame);
            document.getElementById("fame-bar").style.width = giocoData.fame + "%";
            document.getElementById("igiene-text").innerText = Math.round(giocoData.igiene);
            document.getElementById("igiene-bar").style.width = giocoData.igiene + "%";
            document.getElementById("energia-text").innerText = Math.round(giocoData.energia);
            document.getElementById("energia-bar").style.width = giocoData.energia + "%";
            document.getElementById("monete-val").innerText = Math.floor(giocoData.monete);

            let img = document.getElementById("img-personaggio");

            if (giocoData.isDormendo) {
                img.src = "assets/affamato.png";
            } else if (umoreTemporaneo === "felice") {
                img.src = "assets/felice.png";
            } else if (giocoData.fame < 35 || giocoData.energia < 25) {
                img.src = "assets/affamato.png";
            } else {
                img.src = "assets/sfondo.png";
            }
        }

        function attivaFeliceTemporaneo() {
            umoreTemporaneo = "felice";
            setTimeout(() => {
                umoreTemporaneo = "normale";
                aggiornaInterfaccia();
            }, 2500);
        }

        function nutri() {
            if (giocoData.isDormendo) return;
            if (giocoData.monete >= 15) {
                giocoData.monete -= 15;
                giocoData.fame = Math.min(100, giocoData.fame + 30);
                attivaFeliceTemporaneo();
                faiAnimazione();
                aggiornaInterfaccia();
                salvaStato();
            } else {
                alert("Non hai abbastanza monete! Gioca al minigioco per guadagnarne.");
            }
        }

        function lava() {
            if (giocoData.isDormendo) return;
            giocoData.igiene = Math.min(100, giocoData.igiene + 35);
            attivaFeliceTemporaneo();
            faiAnimazione();
            aggiornaInterfaccia();
            salvaStato();
        }

        function dormi() {
            giocoData.isDormendo = !giocoData.isDormendo;
            if (!giocoData.isDormendo) {
                giocoData.energia = 100;
                attivaFeliceTemporaneo();
            }
            aggiornaInterfaccia();
            salvaStato();
        }

        function coccola() {
            if (giocoData.isDormendo) return;
            giocoData.fame = Math.min(100, giocoData.fame + 10);
            giocoData.igiene = Math.min(100, giocoData.igiene + 10);
            giocoData.energia = Math.min(100, giocoData.energia + 10);
            attivaFeliceTemporaneo();
            faiAnimazione();
            aggiornaInterfaccia();
            salvaStato();
        }

        // Funzioni Mini-gioco
        function avviaMiniGioco() {
            if (giocoData.isDormendo) return;
            let scelte = ['pizza', 'doccia', 'nanna'];
            desiderioCorretto = scelte[Math.floor(Math.random() * scelte.length)];
            
            let testi = { 'pizza': 'Tommy vuole mangiare una pizza! 🍕', 'doccia': 'Tommy vuole farsi una doccia! 🚿', 'nanna': 'Tommy ha sonno e vuole riposare! 💤' };
            document.getElementById("mg-domanda").innerText = testi[desiderioCorretto];
            document.getElementById("minigame-box").style.display = "flex";
        }

        function rispondiMiniGioco(risposta) {
            document.getElementById("minigame-box").style.display = "none";
            if (risposta === desiderioCorretto) {
                giocoData.monete += 30; // Premio monete
                giocoData.energia = Math.max(0, giocoData.energia - 5);
                attivaFeliceTemporaneo();
                alert("Bravo! Hai indovinato (+30 🪙)");
            } else {
                alert("Ops, hai sbagliato desiderio! Riprova.");
            }
            aggiornaInterfaccia();
            salvaStato();
        }

        function faiAnimazione() {
            let scena = document.getElementById("scivola-scena");
            scena.style.transform = "translateY(-4px)";
            setTimeout(() => { scena.style.transform = "translateY(0)"; }, 150);
        }

        // Esegui calcoli iniziali e avvia il loop temporale
        calcolaTempoAssenza();
        aggiornaInterfaccia();

        setInterval(() => {
            if (!giocoData.isDormendo) {
                if (giocoData.fame > 0) giocoData.fame -= 0.2;       // Fame scende costante
                if (giocoData.igiene > 0) giocoData.igiene -= 0.05; // Igiene cala lentissima
                if (giocoData.energia > 0) giocoData.energia -= 0.1;// Energia cala lenta
                giocoData.monete += 0.05; // Guadagna monete lentamente nel tempo
            } else {
                if (giocoData.energia < 100) giocoData.energia += 0.5; // Ricarica dormendo
            }
            aggiornaInterfaccia();
            salvaStato();
        }, 3000); // Aggiorna ogni 3 secondi
    </script>
</body>
</html>
